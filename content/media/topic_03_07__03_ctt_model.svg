<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="40" class="title">Classical Test Theory: X = T + E</text>
<rect x="100" y="100" width="120" height="50" class="node"/>
<text x="160" y="128" class="node-text">X</text>
<text x="160" y="144" class="label" font-size="9">Observed score</text>
<line x1="220" y1="125" x2="280" y2="125" class="arrow"/>
<text x="245" y="112" class="label" font-size="9">=</text>
<rect x="300" y="100" width="120" height="50" class="node"/>
<text x="360" y="128" class="node-text">T</text>
<text x="360" y="144" class="label" font-size="9">True score</text>
<line x1="420" y1="125" x2="480" y2="125" class="arrow"/>
<text x="445" y="112" class="label" font-size="9">+</text>
<rect x="500" y="100" width="120" height="50" class="node"/>
<text x="560" y="128" class="node-text">E</text>
<text x="560" y="144" class="label" font-size="9">Error</text>
<text x="400" y="200" class="label">X = T + E: Observed = True + Random Error</text>

</svg>