<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Rorschach Test: Phases of Administration</text>
<rect x="50" y="70" width="150" height="50" class="node"/>
<text x="125" y="98" class="node-text">1. Present</text>
<text x="125" y="112" class="node-text">inkblot</text>
<line x1="200" y1="95" x2="240" y2="95" class="arrow"/>
<rect x="250" y="70" width="150" height="50" class="node"/>
<text x="325" y="98" class="node-text">2. Record</text>
<text x="325" y="112" class="node-text">response</text>
<line x1="400" y1="95" x2="440" y2="95" class="arrow"/>
<rect x="450" y="70" width="150" height="50" class="node"/>
<text x="525" y="98" class="node-text">3. Inquiry</text>
<text x="525" y="112" class="node-text">clarify</text>
<line x1="600" y1="95" x2="640" y2="95" class="arrow"/>
<rect x="650" y="70" width="150" height="50" class="node"/>
<text x="725" y="98" class="node-text">4. Score</text>
<text x="725" y="112" class="node-text">response</text>

</svg>