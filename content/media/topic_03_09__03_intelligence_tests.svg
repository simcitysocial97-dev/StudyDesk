<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Intelligence Tests Comparison</text>
<rect x="50" y="70" width="250" height="120" class="box"/>
<text x="175" y="95" class="label">Stanford-Binet-5</text>
<text x="80" y="120" class="label" font-size="10">• Five cognitive factors</text>
<text x="80" y="135" class="label" font-size="10">• Full Scale IQ</text>
<rect x="350" y="70" width="250" height="120" class="box"/>
<text x="475" y="95" class="label">Raven's Progressive Matrices</text>
<text x="380" y="120" class="label" font-size="10">• Non-verbal</text>
<text x="380" y="135" class="label" font-size="10">• Culture-reduced</text>
<rect x="50" y="210" width="250" height="120" class="box"/>
<text x="175" y="235" class="label">Culture Fair Intelligence Test</text>
<text x="80" y="260" class="label" font-size="10">• Minimises cultural bias</text>
<text x="80" y="275" class="label" font-size="10">• Non-verbal items</text>
<rect x="350" y="210" width="250" height="120" class="box"/>
<text x="475" y="235" class="label">Naglieri / Bhatia</text>
<text x="380" y="260" class="label" font-size="10">• Naglieri: PASS theory</text>
<text x="380" y="275" class="label" font-size="10">• Bhatia: Indian performance test</text>

</svg>