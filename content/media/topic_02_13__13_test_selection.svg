<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .bar2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 02 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="25" class="title">Statistical Test Selection Flowchart</text>
<rect x="300" y="60" width="200" height="50" class="node"/>
<text x="400" y="88" class="node-text">How many groups?</text>
<line x1="400" y1="110" x2="250" y2="150" class="arrow"/><line x1="400" y1="110" x2="550" y2="150" class="arrow"/>
<rect x="100" y="160" width="160" height="50" class="node"/>
<text x="180" y="188" class="node-text">2 groups</text>
<rect x="640" y="160" width="160" height="50" class="node"/>
<text x="720" y="188" class="node-text">3+ groups</text>
<line x1="180" y1="210" x2="180" y2="250" class="arrow"/><line x1="720" y1="210" x2="720" y2="250" class="arrow"/>
<rect x="50" y="260" width="180" height="50" class="node"/>
<text x="140" y="288" class="node-text">t-test</text>
<text x="140" y="302" class="node-text">(independent/paired)</text>
<rect x="600" y="260" width="180" height="50" class="node"/>
<text x="690" y="288" class="node-text">ANOVA</text>
<text x="690" y="302" class="node-text">(one-way/two-way)</text>

</svg>