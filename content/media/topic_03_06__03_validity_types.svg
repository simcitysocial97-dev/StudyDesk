<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Types of Validity</text>
<rect x="50" y="80" width="150" height="60" class="node"/>
<text x="125" y="110" class="node-text">Face</text>
<text x="125" y="126" class="label" font-size="9">Appears valid</text>
<rect x="260" y="80" width="150" height="60" class="node"/>
<text x="335" y="110" class="node-text">Content</text>
<text x="335" y="126" class="label" font-size="9">Covers domain</text>
<rect x="470" y="80" width="150" height="60" class="node"/>
<text x="545" y="110" class="node-text">Criterion</text>
<text x="545" y="126" class="label" font-size="9">External criterion</text>
<rect x="680" y="80" width="150" height="60" class="node"/>
<text x="755" y="110" class="node-text">Construct</text>
<text x="755" y="126" class="label" font-size="9">Theoretical construct</text>
<line x1="200" y1="110" x2="250" y2="110" class="arrow"/>
<line x1="410" y1="110" x2="460" y2="110" class="arrow"/>
<line x1="620" y1="110" x2="670" y2="110" class="arrow"/>

</svg>