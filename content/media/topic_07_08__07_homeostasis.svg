<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <ns0:rect x="150" y="100" width="300" height="180" fill="#f8fafc" stroke="#475569" stroke-width="2" />
  <ns0:text x="300" y="60" font-size="16" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Homeostasis: Hunger, Thirst, Sexual Response</ns0:text>
  <ns0:circle cx="300" cy="160" r="30" fill="#fca5a5" stroke="#475569" stroke-width="2" />
  <ns0:text x="300" y="165" font-size="11" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Hypothalamus</ns0:text>
  <ns0:line x1="300" y1="130" x2="300" y2="190" stroke="#475569" stroke-width="2" />
  <ns0:text x="180" y="220" font-size="11" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Hunger → eating → satiety</ns0:text>
  <ns0:text x="300" y="220" font-size="11" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Thirst → drinking → hydration</ns0:text>
