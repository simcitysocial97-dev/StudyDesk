<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <ns0:rect x="100" y="120" width="250" height="140" fill="#dbeafe" stroke="#475569" stroke-width="2" rx="8" />
  <ns0:text x="225" y="100" font-size="14" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Problem-focused</ns0:text>
  <ns0:text x="225" y="160" font-size="11" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Address the stressor directly</ns0:text>
  <ns0:text x="225" y="200" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Planning, action, support</ns0:text>
  <ns0:text x="225" y="220" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Relaxation, reframing, acceptance</ns0:text>
  <ns0:rect x="400" y="120" width="250" height="140" fill="#dbeafe" stroke="#475569" stroke-width="2" rx="8" />
  <ns0:text x="525" y="100" font-size="14" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Emotion-focused</ns0:text>
  <ns0:text x="525" y="160" font-size="11" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Manage emotional response</ns0:text>
  <ns0:text x="525" y="200" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Planning, action, support</ns0:text>
  <ns0:text x="525" y="220" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Relaxation, reframing, acceptance</ns0:text>
  <ns0:text x="300" y="40" font-size="16" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Coping Strategies: Problem vs Emotion Focused</ns0:text>
