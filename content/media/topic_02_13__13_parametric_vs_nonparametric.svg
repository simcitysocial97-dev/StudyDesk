<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .bar2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 02 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="25" class="title">Parametric vs Non-Parametric Tests</text>
<rect x="50" y="60" width="300" height="150" class="box"/>
<text x="200" y="85" class="label">Parametric Tests</text>
<text x="100" y="110" class="label" font-size="10">• t-test, ANOVA, MANOVA, ANCOVA</text>
<text x="100" y="130" class="label" font-size="10">• Assumptions: Normal distribution,</text>
<text x="100" y="145" class="label" font-size="10">  homogeneity of variance, interval/ratio</text>
<text x="100" y="160" class="label" font-size="10">  data, independence</text>
<rect x="400" y="60" width="300" height="150" class="box"/>
<text x="550" y="85" class="label">Non-Parametric Tests</text>
<text x="450" y="110" class="label" font-size="10">• Chi-square, Mann-Whitney,</text>
<text x="450" y="125" class="label" font-size="10">  Kruskal-Wallis, Wilcoxon</text>
<text x="450" y="145" class="label" font-size="10">• Assumptions: Categorical/ordinal data,</text>
<text x="450" y="160" class="label" font-size="10">  independence, expected frequency ≥ 5</text>
<line x1="350" y1="135" x2="400" y2="135" class="arrow"/>
<text x="370" y="120" class="label" font-size="10" fill="#2c3e50">Choose based on data type</text>

</svg>