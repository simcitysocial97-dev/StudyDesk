<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Attitude Scales Comparison</text>
<rect x="50" y="70" width="250" height="100" class="box"/>
<text x="175" y="95" class="label">Likert</text>
<text x="80" y="120" class="label" font-size="10">Summed agree–disagree</text>
<rect x="350" y="70" width="250" height="100" class="box"/>
<text x="475" y="95" class="label">Semantic Differential</text>
<text x="380" y="120" class="label" font-size="10">Bipolar adjective ratings</text>
<rect x="50" y="190" width="250" height="100" class="box"/>
<text x="175" y="215" class="label">Guttman Scalogram</text>
<text x="80" y="240" class="label" font-size="10">Cumulative endorsements</text>
<rect x="350" y="190" width="250" height="100" class="box"/>
<text x="475" y="215" class="label">Thurstone / Stapel</text>
<text x="380" y="240" class="label" font-size="10">Paired comparisons / −5 to +5</text>

</svg>