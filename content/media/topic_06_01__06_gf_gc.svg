<text x="400" y="30" class="title">Fluid vs Crystallised Intelligence</text><rect x="50" y="80" width="150" height="100" class="box"/><text x="125" y="105" class="label">Fluid Intelligence (Gf)</text><text x="80" y="130" class="label" font-size="10">Peaks in early adulthood</text><text x="80" y="145" class="label" font-size="10">Declines with age</text><rect x="400" y="80" width="150" height="100" class="box"/><text x="475" y="105" class="label">Crystallised Intelligence (Gc)</text><text x="430" y="130" class="label" font-size="10">Increases or stable</text><text x="430" y="145" class="label" font-size="10">with age</text>
