<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" title="Diagram">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#9CA3AF"/></marker></defs>
<rect x="40" y="90" width="150" height="100" rx="8" ry="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<rect x="40" y="90" width="150" height="30" rx="6" ry="4" fill="#7C3AED" stroke="none"/>
<text x="115.0" y="105" font-family="Calibri" font-size="10.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" dy="0">Experimental</tspan></text>
<text x="115.0" y="130" font-family="Calibri" font-size="8.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" dy="0">Manipulates IV</tspan></text>
<text x="115.0" y="152" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" dy="0">✓ Cause–effect</tspan></text>
<text x="115.0" y="166" font-family="Calibri" font-size="8.5" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" dy="0">✗ Artificial; ethical</tspan></text>
<rect x="206" y="90" width="150" height="100" rx="8" ry="4" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<rect x="206" y="90" width="150" height="30" rx="6" ry="4" fill="#0891B2" stroke="none"/>
<text x="281.0" y="105" font-family="Calibri" font-size="10.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="281.0" dy="0">Observation</tspan></text>
<text x="281.0" y="130" font-family="Calibri" font-size="8.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="281.0" dy="0">Watch behaviour</tspan></text>
<text x="281.0" y="152" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="281.0" dy="0">✓ Natural behaviour</tspan></text>
<text x="281.0" y="166" font-family="Calibri" font-size="8.5" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="281.0" dy="0">✗ Observer bias</tspan></text>
<rect x="372" y="90" width="150" height="100" rx="8" ry="4" fill="#FFFFFF" stroke="#BE185D" stroke-width="2"/>
<rect x="372" y="90" width="150" height="30" rx="6" ry="4" fill="#BE185D" stroke="none"/>
<text x="447.0" y="105" font-family="Calibri" font-size="10.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="447.0" dy="0">Case study</tspan></text>
<text x="447.0" y="130" font-family="Calibri" font-size="8.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="447.0" dy="0">In-depth, one/group</tspan></text>
<text x="447.0" y="152" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="447.0" dy="0">✓ Rich detail</tspan></text>
<text x="447.0" y="166" font-family="Calibri" font-size="8.5" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="447.0" dy="0">✗ Not generalisable</tspan></text>
<rect x="538" y="90" width="150" height="100" rx="8" ry="4" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<rect x="538" y="90" width="150" height="30" rx="6" ry="4" fill="#059669" stroke="none"/>
<text x="613.0" y="105" font-family="Calibri" font-size="10.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="613.0" dy="0">Survey</tspan></text>
<text x="613.0" y="130" font-family="Calibri" font-size="8.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="613.0" dy="0">Questionnaires / interviews</tspan></text>
<text x="613.0" y="152" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="613.0" dy="0">✓ Large samples</tspan></text>
<text x="613.0" y="166" font-family="Calibri" font-size="8.5" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="613.0" dy="0">✗ Response bias</tspan></text>
<rect x="704" y="90" width="150" height="100" rx="8" ry="4" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
<rect x="704" y="90" width="150" height="30" rx="6" ry="4" fill="#047857" stroke="none"/>
<text x="779.0" y="105" font-family="Calibri" font-size="10.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="779.0" dy="0">Correlational</tspan></text>
<text x="779.0" y="130" font-family="Calibri" font-size="8.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="779.0" dy="0">Two variables, no manipulation</tspan></text>
<text x="779.0" y="152" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="779.0" dy="0">✓ Relationship</tspan></text>
<text x="779.0" y="166" font-family="Calibri" font-size="8.5" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="779.0" dy="0">✗ Correlation ≠ causation</tspan></text>
<text x="420" y="230" font-family="Calibri" font-size="10" fill="#7C2D12" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="420" dy="0">Correlation does not imply causation — only experiment establishes cause–effect.</tspan></text>
</svg>
