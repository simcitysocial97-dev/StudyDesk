<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Item Characteristic Curve (ICC)</text>
<line x1="80" y1="250" x2="720" y2="250" class="axis"/>
<line x1="80" y1="50" x2="80" y2="250" class="axis"/>
<text x="400" y="275" class="label">Ability (θ)</text>
<text x="60" y="150" class="label" transform="rotate(-90 60 150)">Probability of correct response</text>
<path d="M 80 250 Q 400 100 720 250" class="curve"/>
<text x="400" y="80" class="label" font-size="10">S-shaped ogive</text>
<line x1="400" y1="250" x2="400" y2="175" class="axis" stroke="#e74c3c" stroke-dasharray="4,2"/>
<text x="400" y="200" class="label" fill="#e74c3c" font-size="10">P = 0.50 at θ = b</text>
<text x="400" y="225" class="label" fill="#e74c3c" font-size="10">(difficulty parameter)</text>

</svg>