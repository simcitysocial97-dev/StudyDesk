<svg width="860" height="400" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" title="Diagram">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#9CA3AF"/></marker></defs>
<rect x="40" y="80" width="330" height="40" rx="6" ry="4" fill="#0E6E6E" stroke="none"/>
<text x="205" y="100" font-family="Calibri" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="205" dy="0">ĀSTIKA (Orthodox) — accept Vedic authority</tspan></text>
<rect x="40" y="135" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="150" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Nyāya — logic</tspan></text>
<rect x="40" y="169" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="184" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Vaiśeṣika — metaphysics</tspan></text>
<rect x="40" y="203" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="218" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Sāṅkhya — dualism</tspan></text>
<rect x="40" y="237" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="252" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Yoga — mind control</tspan></text>
<rect x="40" y="271" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="286" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Mīmāṃsā — ritual</tspan></text>
<rect x="40" y="305" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#0E6E6E" stroke-width="1.2"/>
<text x="55" y="320" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="55" dy="0">• Vedānta — liberation</tspan></text>
<rect x="430" y="80" width="330" height="40" rx="6" ry="4" fill="#7C2D12" stroke="none"/>
<text x="595" y="100" font-family="Calibri" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="595" dy="0">NĀSTIKA (Heterodox) — reject Vedic authority</tspan></text>
<rect x="430" y="135" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#7C2D12" stroke-width="1.2"/>
<text x="445" y="150" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="445" dy="0">• Cārvāka — materialism</tspan></text>
<rect x="430" y="169" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#7C2D12" stroke-width="1.2"/>
<text x="445" y="184" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="445" dy="0">• Jainism — ahiṃsā, jīva</tspan></text>
<rect x="430" y="203" width="330" height="30" rx="6" ry="4" fill="#FFFFFF" stroke="#7C2D12" stroke-width="1.2"/>
<text x="445" y="218" font-family="Calibri" font-size="9.5" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="445" dy="0">• Buddhism — anattā, Four Truths</tspan></text>
<text x="420" y="330" font-family="Calibri" font-size="10" fill="#1F3A5F" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="420" dy="0">Pramāṇa — valid means of knowledge: perception, inference, comparison, testimony, postulation, non-cognition.</tspan></text>
</svg>
