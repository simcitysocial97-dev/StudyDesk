<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 05: media/weber_fechner_law.svg</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="400" y="30" class="title">Weber's Law and Fechner's Law</text><text x="200" y="80" class="label">Weber's Law: ΔI/I = k</text><text x="200" y="95" class="label" font-size="10">JND is constant proportion of stimulus</text><text x="600" y="80" class="label">Fechner's Law: S = k log I</text><text x="600" y="95" class="label" font-size="10">Sensation grows logarithmically</text><line x1="100" y1="120" x2="300" y2="120" class="axis"/><line x1="100" y1="120" x2="100" y2="200" class="axis"/><path d="M 100 200 Q 200 140 300 120" class="curve"/><text x="200" y="220" class="label">Stimulus intensity (I)</text><text x="60" y="160" class="label" transform="rotate(-90 60 160)">JND (ΔI)</text>
</svg>