<svg width="860" height="370" viewBox="0 0 860 370" xmlns="http://www.w3.org/2000/svg" title="Diagram">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#9CA3AF"/></marker></defs>
<rect x="80" y="100" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="175" y="116" font-family="Calibri" font-size="11" fill="#7C3AED" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="175" dy="0">Pre-science</tspan></text>
<text x="175" y="134" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="175" dy="0">No framework;</tspan><tspan x="175" dy="8.5">conflicting explanations</tspan></text>
<rect x="290" y="100" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<text x="385" y="116" font-family="Calibri" font-size="11" fill="#0891B2" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="385" dy="0">Normal science</tspan></text>
<text x="385" y="134" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="385" dy="0">Dominant paradigm;</tspan><tspan x="385" dy="8.5">puzzle-solving</tspan></text>
<rect x="500" y="100" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#BE185D" stroke-width="2"/>
<text x="595" y="116" font-family="Calibri" font-size="11" fill="#BE185D" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="595" dy="0">Model drift</tspan></text>
<text x="595" y="134" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="595" dy="0">Anomalies accumulate</tspan></text>
<rect x="710" y="100" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#92400E" stroke-width="2"/>
<text x="805" y="116" font-family="Calibri" font-size="11" fill="#92400E" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="805" dy="0">Model crisis</tspan></text>
<text x="805" y="134" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="805" dy="0">Confidence weakens;</tspan><tspan x="805" dy="8.5">search for new</tspan></text>
<rect x="80" y="260" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
<text x="175" y="276" font-family="Calibri" font-size="11" fill="#047857" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="175" dy="0">Model revolution</tspan></text>
<text x="175" y="294" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="175" dy="0">Competing theories;</tspan><tspan x="175" dy="8.5">one gains</tspan></text>
<rect x="500" y="260" width="190" height="70" rx="8" ry="4" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
<text x="595" y="276" font-family="Calibri" font-size="11" fill="#059669" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="595" dy="0">Paradigm shift</tspan></text>
<text x="595" y="294" font-family="Calibri" font-size="8.5" fill="#222222" text-anchor="middle" dominant-baseline="middle"><tspan x="595" dy="0">New paradigm replaces</tspan><tspan x="595" dy="8.5">old</tspan></text>
