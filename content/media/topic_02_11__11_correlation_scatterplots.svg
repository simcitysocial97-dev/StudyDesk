<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .bar2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 02 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="25" class="title">Correlation: Positive, Negative, Zero</text>
<!-- Positive -->
<rect x="50" y="60" width="250" height="200" class="box"/>
<text x="175" y="80" class="label">Positive (r ≈ +0.8)</text>
<circle cx="90" cy="160" r="4" class="bar"/><circle cx="110" cy="140" r="4" class="bar"/><circle cx="130" cy="120" r="4" class="bar"/>
<circle cx="150" cy="100" r="4" class="bar"/><circle cx="170" cy="90" r="4" class="bar"/><circle cx="190" cy="70" r="4" class="bar"/>
<circle cx="210" cy="60" r="4" class="bar"/><circle cx="230" cy="150" r="4" class="bar"/>
<text x="175" y="270" class="label" font-size="10">As X increases, Y increases</text>
<!-- Negative -->
<rect x="330" y="60" width="250" height="200" class="box"/>
<text x="455" y="80" class="label">Negative (r ≈ -0.8)</text>
<circle cx="370" cy="70" r="4" class="bar2"/><circle cx="390" cy="90" r="4" class="bar2"/><circle cx="410" cy="110" r="4" class="bar2"/>
<circle cx="430" cy="130" r="4" class="bar2"/><circle cx="450" cy="150" r="4" class="bar2"/><circle cx="470" cy="170" r="4" class="bar2"/>
<circle cx="490" cy="190" r="4" class="bar2"/><circle cx="510" cy="150" r="4" class="bar2"/>
<text x="455" y="270" class="label" font-size="10">As X increases, Y decreases</text>
<!-- Zero -->
<rect x="610" y="60" width="250" height="200" class="box"/>
<text x="735" y="80" class="label">Zero (r ≈ 0)</text>
<circle cx="650" cy="90" r="4" class="bar"/><circle cx="670" cy="160" r="4" class="bar"/><circle cx="690" cy="70" r="4" class="bar"/>
<circle cx="710" cy="140" r="4" class="bar"/><circle cx="730" cy="110" r="4" class="bar"/><circle cx="750" cy="170" r="4" class="bar"/>
<circle cx="770" cy="80" r="4" class="bar"/><circle cx="790" cy="150" r="4" class="bar"/>
<text x="735" y="270" class="label" font-size="10">No consistent pattern</text>

</svg>