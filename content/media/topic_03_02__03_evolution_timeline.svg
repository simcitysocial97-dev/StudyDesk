<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Evolution of Psychological Testing</text>
<line x1="50" y1="150" x2="750" y2="150" class="axis"/>
<text x="400" y="175" class="label">Timeline</text>
<!-- Gall -->
<circle cx="100" cy="150" r="8" fill="#e74c3c"/>
<text x="100" y="130" class="label" font-size="10">Gall</text>
<text x="100" y="165" class="label" font-size="10">Phrenology</text>
<text x="100" y="180" class="label" font-size="10">early 1800s</text>
<!-- Galton -->
<circle cx="250" cy="150" r="8" fill="#e74c3c"/>
<text x="250" y="130" class="label" font-size="10">Galton</text>
<text x="250" y="165" class="label" font-size="10">Anthropometrics</text>
<text x="250" y="180" class="label" font-size="10">1885</text>
<!-- Fechner -->
<circle cx="400" cy="150" r="8" fill="#e74c3c"/>
<text x="400" y="130" class="label" font-size="10">Fechner</text>
<text x="400" y="165" class="label" font-size="10">Chronometry</text>
<text x="400" y="180" class="label" font-size="10">mid-1800s</text>
<!-- Binet -->
<circle cx="550" cy="150" r="8" fill="#e74c3c"/>
<text x="550" y="130" class="label" font-size="10">Binet</text>
<text x="550" y="165" class="label" font-size="10">Psychometrics</text>
<text x="550" y="180" class="label" font-size="10">1905</text>
<!-- Arrows -->
<line x1="110" y1="150" x2="240" y2="150" class="arrow"/>
<line x1="260" y1="150" x2="390" y2="150" class="arrow"/>
<line x1="410" y1="150" x2="540" y2="150" class="arrow"/>

</svg>