<svg width="860" height="360" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" title="Diagram">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0,0 8,3.5 0,7" fill="#9CA3AF"/></marker></defs>
<rect x="10" y="80" width="260" height="40" rx="6" ry="4" fill="#7C3AED" stroke="none"/>
<text x="140.0" y="100" font-family="Calibri" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="140.0" dy="0">Socrates</tspan><tspan x="140.0" dy="13.2">(469–399 BCE)</tspan></text>
<rect x="10" y="130" width="260" height="190" rx="6" ry="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="20" y="148" font-family="Calibri" font-size="8.5" fill="#7C3AED" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Focus:</tspan></text>
<text x="20" y="160" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Soul &amp; virtues</tspan></text>
<text x="20" y="178" font-family="Calibri" font-size="8.5" fill="#7C3AED" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Method:</tspan></text>
<text x="20" y="190" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Socratic dialogue</tspan></text>
<text x="20" y="208" font-family="Calibri" font-size="8.5" fill="#7C3AED" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Epistemology:</tspan></text>
<text x="20" y="220" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Rationalist — innate</tspan></text>
<text x="20" y="238" font-family="Calibri" font-size="8.5" fill="#7C3AED" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Key:</tspan></text>
<text x="20" y="250" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="20" dy="0">Groundwork for dualism</tspan></text>
<rect x="280" y="80" width="260" height="40" rx="6" ry="4" fill="#0891B2" stroke="none"/>
<text x="410.0" y="100" font-family="Calibri" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="0">Plato</tspan><tspan x="410.0" dy="13.2">(428–348 BCE)</tspan></text>
<rect x="280" y="130" width="260" height="190" rx="6" ry="4" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5"/>
<text x="290" y="148" font-family="Calibri" font-size="8.5" fill="#0891B2" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Focus:</tspan></text>
<text x="290" y="160" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Theory of Forms</tspan></text>
<text x="290" y="178" font-family="Calibri" font-size="8.5" fill="#0891B2" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Method:</tspan></text>
<text x="290" y="190" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Recollection (anamnesis)</tspan></text>
<text x="290" y="208" font-family="Calibri" font-size="8.5" fill="#0891B2" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Epistemology:</tspan></text>
<text x="290" y="220" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Rationalist — innate</tspan></text>
<text x="290" y="238" font-family="Calibri" font-size="8.5" fill="#0891B2" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Key:</tspan></text>
<text x="290" y="250" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="290" dy="0">Soul pre-exists body</tspan></text>
<rect x="550" y="80" width="260" height="40" rx="6" ry="4" fill="#BE185D" stroke="none"/>
<text x="680.0" y="100" font-family="Calibri" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle"><tspan x="680.0" dy="0">Aristotle</tspan><tspan x="680.0" dy="13.2">(384–322 BCE)</tspan></text>
<rect x="550" y="130" width="260" height="190" rx="6" ry="4" fill="#FFFFFF" stroke="#BE185D" stroke-width="1.5"/>
<text x="560" y="148" font-family="Calibri" font-size="8.5" fill="#BE185D" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Focus:</tspan></text>
<text x="560" y="160" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Tabula rasa</tspan></text>
<text x="560" y="178" font-family="Calibri" font-size="8.5" fill="#BE185D" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Method:</tspan></text>
<text x="560" y="190" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Logic / syllogism</tspan></text>
<text x="560" y="208" font-family="Calibri" font-size="8.5" fill="#BE185D" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Epistemology:</tspan></text>
<text x="560" y="220" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Empiricist — senses</tspan></text>
<text x="560" y="238" font-family="Calibri" font-size="8.5" fill="#BE185D" font-weight="bold" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Key:</tspan></text>
<text x="560" y="250" font-family="Calibri" font-size="9" fill="#222222" text-anchor="start" dominant-baseline="middle"><tspan x="560" dy="0">Rejects Forms; monism</tspan></text>
