<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 03 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Test Construction Process</text>
<rect x="300" y="70" width="200" height="50" class="node"/>
<text x="400" y="98" class="node-text">1. Define Objectives</text>
<line x1="400" y1="120" x2="400" y2="150" class="arrow"/>
<rect x="300" y="160" width="200" height="50" class="node"/>
<text x="400" y="188" class="node-text">2. Develop Item Pool</text>
<line x1="400" y1="210" x2="400" y2="240" class="arrow"/>
<rect x="300" y="250" width="200" height="50" class="node"/>
<text x="400" y="278" class="node-text">3. Pilot Testing</text>
<line x1="400" y1="300" x2="400" y2="330" class="arrow"/>
<rect x="300" y="340" width="200" height="50" class="node"/>
<text x="400" y="368" class="node-text">4. Item Analysis</text>
<line x1="400" y1="390" x2="400" y2="420" class="arrow"/>
<rect x="300" y="430" width="200" height="50" class="node"/>
<text x="400" y="458" class="node-text">5. Item Selection</text>
<line x1="400" y1="460" x2="400" y2="490" class="arrow"/>
<rect x="300" y="500" width="200" height="50" class="node"/>
<text x="400" y="528" class="node-text">6. Standardisation</text>

</svg>