<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .bar2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 02 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Independent, Dependent and Extraneous Variables</text>
<!-- IV box -->
<rect x="150" y="100" width="120" height="60" class="node"/>
<text x="210" y="132" class="node-text">Independent Variable</text>
<text x="210" y="148" class="node-text">(Manipulated)</text>
<!-- Arrow -->
<line x1="270" y1="130" x2="410" y2="130" class="arrow"/>
<text x="335" y="115" class="label" font-size="10">affects</text>
<!-- DV box -->
<rect x="530" y="100" width="120" height="60" class="node"/>
<text x="590" y="132" class="node-text">Dependent Variable</text>
<text x="590" y="148" class="node-text">(Measured)</text>
<!-- Extraneous variable -->
<rect x="300" y="220" width="140" height="60" class="node" fill="#fdf2e9" stroke="#e67e22"/>
<text x="370" y="252" class="node-text">Extraneous Variable</text>
<text x="370" y="268" class="node-text">(Uncontrolled)</text>
<!-- Confounding arrows -->
<line x1="340" y1="220" x2="190" y2="180" class="arrow" stroke="#e67e22"/>
<line x1="400" y1="220" x2="570" y2="180" class="arrow" stroke="#e67e22"/>
<text x="240" y="195" class="label" font-size="10" fill="#e67e22">confounds</text>
<text x="500" y="195" class="label" font-size="10" fill="#e67e22">confounds</text>

</svg>