<?xml version='1.0' encoding='utf-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <ns0:rect x="60" y="100" width="120" height="100" fill="#fca5a5" stroke="#475569" stroke-width="2" rx="6" />
  <ns0:text x="120" y="130" font-size="11" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Rorschach Inkblot</ns0:text>
  <ns0:text x="120" y="160" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">projective</ns0:text>
  <ns0:rect x="200" y="100" width="120" height="100" fill="#fca5a5" stroke="#475569" stroke-width="2" rx="6" />
  <ns0:text x="260" y="130" font-size="11" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">TAT (Thematic Apperception)</ns0:text>
  <ns0:text x="260" y="160" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">projective</ns0:text>
  <ns0:rect x="340" y="100" width="120" height="100" fill="#a5f3fc" stroke="#475569" stroke-width="2" rx="6" />
  <ns0:text x="400" y="130" font-size="11" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">MMPI (Objective)</ns0:text>
  <ns0:text x="400" y="160" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">objective</ns0:text>
  <ns0:rect x="480" y="100" width="120" height="100" fill="#a5f3fc" stroke="#475569" stroke-width="2" rx="6" />
  <ns0:text x="540" y="130" font-size="11" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">16 PF (Objective)</ns0:text>
  <ns0:text x="540" y="160" font-size="10" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">objective</ns0:text>
  <ns0:text x="300" y="40" font-size="16" fill="bold" text-anchor="middle" font-family="Arial, sans-serif">Personality Assessment: Projective vs Objective</ns0:text>
  <ns0:text x="300" y="240" font-size="11" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">Projective: ambiguous stimuli; Objective: structured inventory</ns0:text>
