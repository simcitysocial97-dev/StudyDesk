<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .axis { stroke: #333; stroke-width: 1.5; }
  .curve { fill: none; stroke: #2c3e50; stroke-width: 2.5; }
  .bar { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
  .bar2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
  .arrow { fill: #2c3e50; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
  .node { fill: #ecf0f1; stroke: #34495e; stroke-width: 1.5; }
  .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; text-anchor: middle; }
  .box { fill: #f8f9fa; stroke: #34495e; stroke-width: 1.5; }
</style>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/></marker></defs>
<title>Unit 02 Visual</title>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="400" y="30" class="title">Normal Probability Curve (Bell Curve)</text>
<!-- X axis -->
<line x1="50" y1="350" x2="750" y2="350" class="axis"/>
<text x="400" y="375" class="label">Standard deviations from mean</text>
<!-- Mean line -->
<line x1="400" y1="300" x2="400" y2="350" class="axis" stroke="#e74c3c" stroke-dasharray="4,2"/>
<text x="400" y="290" class="label" fill="#e74c3c">Mean = Median = Mode</text>
<!-- Tick labels -->
<text x="120" y="370" class="label">-3</text><text x="220" y="370" class="label">-2</text><text x="320" y="370" class="label">-1</text>
<text x="400" y="370" class="label">0</text><text x="480" y="370" class="label">+1</text><text x="560" y="370" class="label">+2</text><text x="640" y="370" class="label">+3</text>
<!-- Percentage labels -->
<text x="80" y="330" class="label" font-size="10">0.1%</text><text x="180" y="330" class="label" font-size="10">2.1%</text><text x="280" y="330" class="label" font-size="10">13.6%</text>
<text x="380" y="330" class="label" font-size="10">34.1%</text><text x="480" y="330" class="label" font-size="10">34.1%</text><text x="560" y="330" class="label" font-size="10">13.6%</text>
<text x="640" y="330" class="label" font-size="10">2.1%</text><text x="720" y="330" class="label" font-size="10">0.1%</text>
<!-- Bell curve path -->
<path d="M 50 300 Q 200 300 300 150 Q 400 50 500 150 Q 600 300 750 300" class="curve"/>
<!-- 68% region -->
<path d="M 320 300 Q 320 200 400 150 Q 480 200 480 300 Z" fill="rgba(52,152,219,0.3)" stroke="#3498db" stroke-width="1"/>
<text x="400" y="280" class="label" font-size="10" fill="#2980b9">68%</text>
<!-- 95% region -->
<path d="M 220 300 Q 220 250 400 150 Q 580 250 580 300 Z" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
<text x="400" y="260" class="label" font-size="10" fill="#2980b9">95%</text>

</svg>