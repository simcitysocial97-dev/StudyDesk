<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5ef">
  <meta name="description" content="A 15-day UGC NET Psychology revision and practice-question planner that works offline.">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>StudyDesk · UGC NET JRF</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-frame">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="StudyDesk home" data-action="navigate" data-view="dashboard">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M5 8.5c4.6-2.1 9.1-1.6 13 1.2v18c-3.9-2.8-8.4-3.3-13-1.2z"/><path d="M31 8.5c-4.6-2.1-9.1-1.6-13 1.2v18c3.9-2.8 8.4-3.3 13-1.2z"/><path d="M18 10v18"/></svg></span>
        <span class="brand-copy"><strong>StudyDesk</strong><small>UGC NET · JRF 2026</small></span>
      </a>
      <div class="topbar-actions">
        <div class="exam-chip" id="header-countdown" aria-live="polite"></div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch theme"></button>
      </div>
    </header>
    <div class="workspace">
      <aside class="desktop-sidebar" aria-label="Main navigation">
        <div id="desktop-nav" class="nav-stack"></div>
        <div class="sidebar-bottom">
          <div class="sidebar-note"><span class="dot dot-green"></span> Stored on this device</div>
          <button class="sidebar-link" type="button" data-action="navigate" data-view="install">Install &amp; offline guide <span aria-hidden="true">↗</span></button>
        </div>
      </aside>
      <main id="main-content" class="main-content" tabindex="-1">
        <div class="loading-state"><span class="loader"></span><p>Loading your study space…</p></div>
      </main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Primary navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="update-banner" class="update-banner" hidden>
    <span>A safe offline update is ready.</span>
    <button type="button" data-action="apply-update">Reload to update</button>
    <button class="quiet-button" type="button" data-action="dismiss-update" aria-label="Dismiss update notice">×</button>
  </div>
  <script src="./data.js"></script>
  <script src="./core.js"></script>
  <script src="./learn.js"></script>
  <script src="./db.js"></script>
  <script src="./study-ui.js"></script>
  <script src="./app.js"></script>
</body>
</html>
